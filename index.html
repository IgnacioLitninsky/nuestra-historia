<script>
'use strict';
(function(){
if(typeof TEXTOS==='undefined'||typeof GUION==='undefined'){document.body.innerHTML='<p style="color:#fff;font:16px sans-serif;padding:24px;line-height:1.5">No se pudo leer <b>textos.js</b>.<br>Revisá que esté al lado de index.html y que no se haya borrado una coma o una comilla en la última edición.</p>';return;}
const W=192,H=342,T=TEXTOS;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
function srand(seed){let s=seed;return()=>(s=s*16807%2147483647)/2147483647;}

/* ---------- guardado ---------- */
const QS=new URLSearchParams(location.search);
const PC=matchMedia('(hover:hover) and (pointer:fine)').matches;
const DEBUG=QS.has('debug');
const KEY='nuestra-historia';
const defSave=()=>({ok:false,intro:false,done:[],eggs:[],jar:{read:[],last:''},record:0,beat:false,cartas:[],finished:false,mute:false});
let SAVE=defSave();
try{if(QS.has('reset'))localStorage.removeItem(KEY);const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')SAVE=Object.assign(defSave(),s);}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}}
function hoy(){const f=QS.get('fecha');if(f&&/^\d{4}-\d{2}-\d{2}$/.test(f)){const[y,m,d]=f.split('-').map(Number);return new Date(y,m-1,d,12);}return new Date();}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

/* ---------- canvas ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');let S=2;
function resize(){const wr=$('#wrap'),cs=getComputedStyle(wr);
  const desk=innerWidth>=700&&innerHeight>=560&&innerWidth>innerHeight*.9;document.body.classList.toggle('desk',desk);
  let aw=wr.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  let ah=wr.clientHeight-parseFloat(cs.paddingTop||0)-parseFloat(cs.paddingBottom||0);
  if(desk){aw-=36+40;ah-=80+40;}
  const gw=Math.max(160,Math.floor(Math.min(aw,ah*W/H)||0)),gh=Math.floor(gw*H/W);
  const g=$('#game');g.style.width=gw+'px';g.style.height=gh+'px';
  document.documentElement.style.setProperty('--u',(gw/W)+'px');
  const dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(gw*dpr);cv.height=Math.round(gh*dpr);S=cv.width/W;}
addEventListener('resize',resize);resize();
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));c.fillRect(cx-w,cy+y,w*2+1,1);}}
function ell(c,cx,cy,rx,ry,col){c.fillStyle=col;for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));c.fillRect(cx-w,cy+y,w*2+1,1);}}
function bands(c,y0,y1,cols){const n=cols.length,bh=(y1-y0)/n;for(let i=0;i<n;i++)R(c,0,Math.floor(y0+i*bh),W,Math.ceil(bh)+1,cols[i]);
  for(let i=1;i<n;i++){const y=Math.floor(y0+i*bh);for(let x=0;x<W;x+=2){R(c,x,y-1,1,1,cols[i]);R(c,x+1,y,1,1,cols[i-1]);}}}
function txt(c,s,x,y,size,col,align,weight){c.font=(weight||600)+' '+size+"px 'Pixelify Sans',ui-monospace,monospace";c.fillStyle=col;c.textAlign=align||'center';c.textBaseline='middle';c.fillText(s,x,y);}
function spr(c,img,x,y,sc){sc=sc||1;c.drawImage(img,Math.round(x),Math.round(y),img.width*sc,img.height*sc);}
function mk(rows,pal){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++){const r=rows[j];for(let i=0;i<r.length;i++){const col=pal[r[i]];if(col){x.fillStyle=col;x.fillRect(i,j,1,1);}}}return c;}
function edit(rows,list){const r=rows.slice();for(const[y,x,ch]of list)r[y]=r[y].substring(0,x)+ch+r[y].substring(x+1);return r;}
const BGC={};
function cached(name,fn){if(!BGC[name]){const c=document.createElement('canvas');c.width=W;c.height=H;fn(c.getContext('2d'));BGC[name]=c;}return BGC[name];}

/* ---------- audio ---------- */
const AU=(()=>{let ac=null,master=null,mus=null,sfxG=null,timer=null,track=null,voices=[],pending=null;
  const NT={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const fq=n=>{const m=/^([A-G]#?)(\d)$/.exec(n);return m?440*Math.pow(2,((+m[2]+1)*12+NT[m[1]]-69)/12):0;};
  const parse=s=>{const t=s.split(/\s+/).filter(x=>x&&x!=='|'),o=[];for(let i=0;i<t.length;i+=2)o.push([t[i],parseFloat(t[i+1])]);return o;};
  const TR={
    hub:{bpm:92,v:[['triangle',.5,'E5 1 G5 1 A5 1 G5 1 E5 1 D5 1 C5 2 D5 1 E5 1 G5 1 E5 1 D5 3 - 1 E5 1 G5 1 A5 1 C6 1 B5 1 A5 1 G5 2 A5 1 G5 1 E5 1 D5 1 C5 3 - 1'],['sine',.6,'C3 2 G3 2 A2 2 E3 2 F2 2 C3 2 G2 2 D3 2 C3 2 G3 2 E3 2 B2 2 F2 2 G2 2 C3 4']]},
    nivel:{bpm:126,v:[['square',.18,'C5 .5 E5 .5 G5 .5 E5 .5 A5 .5 G5 .5 E5 .5 C5 .5 D5 .5 F5 .5 A5 .5 F5 .5 G5 1 - 1 E5 .5 G5 .5 C6 .5 G5 .5 A5 .5 G5 .5 E5 .5 D5 .5 C5 1 D5 .5 E5 .5 C5 1 - 1'],['triangle',.55,'C3 1 C4 1 C3 1 C4 1 D3 1 D4 1 G2 1 G3 1 C3 1 C4 1 A2 1 A3 1 F2 1 G2 1 C3 2']]},
    amor:{bpm:72,v:[['triangle',.5,'G4 2 C5 2 E5 3 D5 1 C5 2 A4 2 G4 4 A4 2 C5 2 F5 3 E5 1 D5 2 B4 2 C5 4'],['sine',.55,'C3 4 A2 4 F2 4 G2 4 F2 4 D3 4 G2 4 C3 4']]},
    arcade:{bpm:146,v:[['square',.16,'C5 .5 E5 .5 G5 .5 E5 .5 A5 .5 G5 .5 E5 .5 C5 .5 D5 .5 F5 .5 A5 .5 F5 .5 G5 1 - 1 E5 .5 G5 .5 C6 .5 G5 .5 A5 .5 G5 .5 E5 .5 D5 .5 C5 1 D5 .5 E5 .5 C5 1 - 1'],['triangle',.55,'C3 1 C4 1 C3 1 C4 1 D3 1 D4 1 G2 1 G3 1 C3 1 C4 1 A2 1 A3 1 F2 1 G2 1 C3 2']]}};
  for(const k in TR)TR[k].v=TR[k].v.map(([type,vol,s])=>({type,vol,seq:parse(s)}));
  const now=()=>ac?ac.currentTime:0;
  function tone(f,t0,d,type,vol,dest,slide){if(!ac||!f)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol||.2,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(dest||sfxG);o.start(t0);o.stop(t0+d+.03);}
  const FX={tap:()=>tone(880,now(),.06,'square',.12),blip:()=>tone(1250,now(),.025,'square',.04),jump:()=>tone(380,now(),.16,'square',.16,0,2.2),
    catch:()=>{const t=now();tone(988,t,.06,'square',.16);tone(1319,t+.06,.08,'square',.16);},bonk:()=>tone(170,now(),.14,'triangle',.35,0,.6),
    egg:()=>{const t=now();[1047,1319,1568,2093].forEach((f,i)=>tone(f,t+i*.07,.13,'square',.13));},
    win:()=>{const t=now();[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,t+i*.09,.15,'square',.15));},
    heart:()=>{const t=now();tone(784,t,.1,'triangle',.3);tone(1047,t+.1,.22,'triangle',.3);},

/* ---------- actores ---------- */
function actor(id,o){return Object.assign({id,sp:SPRITE_OF[id]||'vale',x:96,y:250,sc:2,vis:true,tw:null,emo:null,shake:0,walk:0,seed:Math.random()*5},o||{});}
function updActor(a,dt){a.walk=0;if(a.tw){const w=a.tw;w.t+=dt*1000;const k=Math.min(1,w.t/w.ms);a.x=w.fx+(w.tx-w.fx)*k;a.y=w.fy+(w.ty-w.fy)*k;a.walk=1;if(k>=1){a.tw=null;if(w.cb)w.cb();}}
  if(a.emo){a.emo.t-=dt;if(a.emo.t<=0)a.emo=null;}if(a.shake>0)a.shake-=dt;}
function moveTo(a,x,y,speed,cb){const d=Math.hypot(x-a.x,y-a.y);a.tw={fx:a.x,fy:a.y,tx:x,ty:y,t:0,ms:Math.max(60,d/(speed||80)*1000),cb};}
function drawActor(c,a,t){if(!a.vis)return;const set=SP[a.sp];const img=Array.isArray(set)?set[((t+a.seed)%3.6)<.12?1:0]:set;
  const bob=a.walk&&Math.floor(t*8)%2?-a.sc:0,sh=a.shake>0?Math.round(Math.sin(t*90))*a.sc*.5:0;
  spr(c,img,a.x-img.width*a.sc/2+sh,a.y-img.height*a.sc+bob,a.sc);
  if(a.emo){const e=SP[a.emo.k];spr(c,e,a.x-e.width,a.y-img.height*a.sc-e.height*2-4+Math.round(Math.sin(t*6)),2);}}
function hitActor(a,x,y){if(!a||!a.vis)return false;const s=SP[a.sp],img=Array.isArray(s)?s[0]:s;return Math.abs(x-a.x)<img.width*a.sc/2+4&&y>a.y-img.height*a.sc-4&&y<a.y+4;}

/* ---------- motor de historias ---------- */
const SPRITE_OF={V:'vale',Y:'nacho',A:'amigo',P:'pablo'};
function Story(cfg){const A={};
  for(const k in cfg.actores||{}){const o=cfg.actores[k];A[k]=actor(k,{sp:o.sp||SPRITE_OF[k],x:o.x,y:o.y,vis:!o.oculto,sc:o.sc||2});}
  let i=-1,fondo=cfg.fondo,waitT=0,waitCb=null;
  const S0={A,
    enter(){AU.play(cfg.musica||'hub');HUD.mute();i=-1;next();},
    update(dt){for(const k in A)updActor(A[k],dt);if(waitT>0){waitT-=dt;if(waitT<=0&&waitCb){const f=waitCb;waitCb=null;f();}}},
    draw(c,t){drawBG(c,fondo,t);if(cfg.extra)cfg.extra(c,t,fondo);Object.values(A).sort((a,b)=>a.y-b.y).forEach(a=>drawActor(c,a,t));if(cfg.extraTop)cfg.extraTop(c,t,fondo);
      if(cfg.frente&&fondo===cfg.fondo)c.drawImage(cached(cfg.frente,BG[cfg.frente]),0,0);
      for(const h of cfg.hot||[])if(!SAVE.eggs.includes(h.egg)){const a=h.actor&&A[h.actor];if(a&&a.vis)glint(c,a.x+6,a.y-40,t,2);else if(!h.actor)glint(c,h.x+h.w/2,h.y+4,t,h.x%3);}},
    down(x,y){for(const h of cfg.hot||[]){if(SAVE.eggs.includes(h.egg))continue;const ok=h.actor?hitActor(A[h.actor],x,y):(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);if(ok){egg(h.egg);return;}}Dlg.advance();},
    key(k){if(k===' '||k==='Enter')Dlg.advance();}};
  function next(){i++;const steps=cfg.pasos||[];if(i>=steps.length){Dlg.hide();if(cfg.fin)cfg.fin();return;}run(steps[i]);}
  function run(s){
    if(typeof s==='string'){const m=/^([NVYAP]):\s*([\s\S]*)$/.exec(s);if(m){Dlg.show(m[1],m[2],next);}else Dlg.show('N',s,next);return;}
    if(s.mostrar){if(A[s.mostrar])A[s.mostrar].vis=true;return next();}
    if(s.ocultar){if(A[s.ocultar])A[s.ocultar].vis=false;return next();}
    if(s.poner){const a=A[s.poner];if(a){a.tw=null;a.x=s.x;a.y=s.y;a.vis=true;}return next();}
    if(s.mover){const a=A[s.mover];if(!a)return next();a.vis=true;moveTo(a,s.x,s.y,s.vel||90,next);AU.sfx('step');return;}
    if(s.emo){const a=A[s.emo];const map={corazon:'corazon',enojo:'enojo',gota:'gota',excl:'excl',zzz:'zzz'};if(a)a.emo={k:map[s.tipo]||'corazon',t:1.8};if(s.tipo==='corazon')AU.sfx('heart');return next();}
    if(s.temblar){const a=A[s.temblar];if(a)a.shake=1.5;return next();}
    if(s.efecto){const v=A.V||A.Y;if(s.efecto==='confeti')FX.confetti();else FX.hearts(v?v.x:96,v?v.y-40:180,16);AU.sfx('heart');return next();}
    if(s.fondo){fade(()=>{fondo=s.fondo;next();});return;}
    if(s.esperar){waitT=s.esperar/1000;waitCb=next;return;}
    if(s.opciones){Dlg.choice(s.opciones,()=>next());return;}
    if(s.fn){s.fn(next,S0);return;}
    next();}
  return S0;}

/* ---------- candado ---------- */
function checkPass(v){const s=String(v).toLowerCase(),c=T.contrasena,raw=s.match(/\d+/g)||[];let n=raw.map(Number);
  if(raw.length===1&&raw[0].length>=6){const d=raw[0],y=+d.slice(-4),r=d.slice(0,-4);n=r.length===2?[+r[0],+r[1],y]:[+r.slice(0,r.length-2),+r.slice(-2),y];}
  if(n.length>=2&&n[0]===c.dia&&n[1]===c.mes&&(n.length<3||n[2]===c.anio||n[2]===c.anio%100))return true;
  const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return s.includes(MES[c.mes-1])&&n[0]===c.dia&&(n.length<2||n[1]===c.anio);}

function Jar(){const today=ymd(hoy()),J=SAVE.jar,all=T.frasco;J.read=J.read.filter(i=>i<all.length);const left=all.map((_,i)=>i).filter(i=>!J.read.includes(i));let msg,sub;
  if(left.length&&(J.last!==today||DEBUG)){const i=pick(left);J.read.push(i);J.last=today;persist();msg=all[i];sub=T.ui.frascoNuevo;AU.sfx('egg');}
  else if(!left.length){msg=all[J.read[J.read.length-1]]||'';sub=T.ui.frascoVacio;}
  else{msg=null;sub=T.ui.frascoHoyYa;}
  const prev=J.read.slice().reverse().filter(i=>all[i]!==msg).map(i=>`<div class="it">${esc(all[i])}</div>`).join('');
  modal(`<h2>Frasco para días tristes</h2><div class="sub">${esc(sub)} · ${J.read.length}/${all.length}</div>${msg?`<div class="note">${esc(msg)}</div>`:''}${prev?`<div class="sub" style="margin-top:calc(var(--u)*6)">Los que ya leíste</div><div class="list">${prev}</div>`:''}<div class="row"><button class="btn pink" data-act="close">Cerrar</button></div>`);}
